// workload heat for a given calendar day
function loadForDay(dt) {
  const items = TESTS.filter((t) => sameDay(t.date, dt));
  const score = items.reduce((s, t) => s + TYPE_W[t.type], 0);
  return { items, score };
}
function heatOf(score) {
  if (score <= 0) return { k: 'none', bg: '#F3F5FB', fg: '#9AA3BC', ring: 'transparent', label: 'Liber' };
  if (score <= 2) return { k: 'calm', bg: '#DEF7E6', fg: '#0F7C39', ring: '#9BE3B5', label: 'Ușor' };
  if (score <= 4) return { k: 'light', bg: '#FBF1CF', fg: '#946500', ring: '#E8D27A', label: 'Moderat' };
  if (score <= 6) return { k: 'busy', bg: '#FCE6D5', fg: '#B14A08', ring: '#F3B483', label: 'Încărcat' };
  return { k: 'heavy', bg: '#FBDFDF', fg: '#AE1919', ring: '#F0A3A3', label: 'Supraîncărcat' };
}
// collisions: a day with >=2 graded assessments (test/quiz) is a clash
function collisionsThisWeek() {
  const out = [];
  for (let i = 0; i < 5; i++) {
    const dt = addDays(WEEK_MON, i);
    const graded = TESTS.filter((t) => sameDay(t.date, dt) && t.type !== 'tema');
    if (graded.length >= 2) out.push({ dt, items: graded });
  }
  return out;
}
// "what do I need": grades list, target avg, how many upcoming grades n
function whatINeed(grades, target, n) {
  const sum = grades.reduce((s, x) => s + x, 0);
  const total = grades.length + n;
  const needEach = (target * total - sum) / n;
  return needEach;
}

/* animated count-up number */
function useCountUp(value, dur = 700) {
  const [v, setV] = useState(value);
  const reduce = useReducedMotion();
  const prev = useRef(value);
  useEffect(() => {
    if (reduce) { setV(value); prev.current = value; return; }
    const from = prev.current, to = value, t0 = performance.now();
    let raf;
    const tick = (t) => {
      const p = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      setV(from + (to - from) * e);
      if (p < 1) raf = requestAnimationFrame(tick); else prev.current = to;
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [value]);
  return v;
}

/* Watermelon-style fluid tabs: sliding pill via shared layoutId */
function FluidTabs({ tabs, active, onChange, id, size = 'md' }) {
  const pad = size === 'sm' ? 'px-3 py-1.5 text-[13px]' : 'px-4 py-2 text-sm';
  return (
    <div className="relative inline-flex items-center gap-1 rounded-full border border-line bg-white/70 p-1 shadow-pill backdrop-blur">
      {tabs.map((t) => {
        const on = active === t.id;
        return (
          <button key={t.id} onClick={() => onChange(t.id)}
            className={cx('relative rounded-full font-semibold transition-colors', pad, on ? 'text-ink' : 'text-muted hover:text-ink')}>
            {on && <motion.span layoutId={`fluid-${id}`} transition={spring}
              className="absolute inset-0 rounded-full bg-brand-50 ring-1 ring-brand-100" />}
            <span className="relative z-10 inline-flex items-center gap-1.5">{t.icon}{t.label}</span>
          </button>
        );
      })}
    </div>
  );
}

function ShimmerButton({ children, className, icon, ...p }) {
  return (
    <button {...p} className={cx('group relative overflow-hidden rounded-xl bg-brand px-4 py-2.5 font-semibold text-white shadow-card transition-all hover:bg-brand-600 active:scale-[.98] disabled:opacity-50', className)}>
      <span className="relative z-10 inline-flex items-center justify-center gap-2">{icon}{children}</span>
      <span className="pointer-events-none absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-white/30 to-transparent transition-transform duration-700 group-hover:translate-x-full" />
    </button>
  );
}

function Segments({ value, max = 10, tone = '#4B3BE8', count = 10 }) {
  const filled = Math.round((value / max) * count);
  return (
    <div className="flex gap-0.5">
      {Array.from({ length: count }).map((_, i) => (
        <motion.span key={i} initial={{ opacity: 0, scaleY: .4 }} animate={{ opacity: 1, scaleY: 1 }}
          transition={{ delay: i * 0.02, duration: .25 }}
          className="h-3 w-1.5 rounded-full" style={{ background: i < filled ? tone : '#E3E7F1' }} />
      ))}
    </div>
  );
}

/* shared-layout modal shell */
function Sheet({ open, onClose, children, labelledBy }) {
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
  }, [open]);
  return (
    <AnimatePresence>
      {open && (
        <div className="fixed inset-0 z-50 flex items-end justify-center sm:items-center sm:p-6" role="dialog" aria-modal="true" aria-labelledby={labelledBy}>
          <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}
            onClick={onClose} className="absolute inset-0 bg-ink/40 backdrop-blur-sm" />
          {children}
        </div>
      )}
    </AnimatePresence>
  );
}

/* ------------------------------------------------------------------ *
 *  View: WORKLOAD — collision detector + heatmap (the differentiator)
 * ------------------------------------------------------------------ */
function WorkloadView({ role }) {
  const reduce = useReducedMotion();
  const weeks = [0, 1];
  const [addFor, setAddFor] = useState(null); // teacher: picking a date
  const collisions = collisionsThisWeek();

  const gridDays = (wk) => Array.from({ length: 5 }).map((_, i) => {
    const dt = addDays(WEEK_MON, wk * 7 + i);
    const { items, score } = loadForDay(dt);
    return { dt, items, score, heat: heatOf(score) };
  });

  // teacher: suggested calmest days across both weeks
  const allDays = [...gridDays(0), ...gridDays(1)];
  const suggestions = [...allDays].filter(d => d.dt >= TODAY).sort((a, b) => a.score - b.score).slice(0, 3);

  return (
    <div className="mx-auto w-full max-w-[1120px] px-4 pb-28 pt-5 sm:px-6 lg:pb-10">
      <ViewHead title="Încărcare" sub={role === 'teacher' ? 'Vezi cât de plină e săptămâna clasei înainte să programezi o evaluare' : 'Harta efortului pe zile — ca să nu te aglomerezi'} icon={<Icons.pulse />}
        right={role === 'teacher' && <ShimmerButton icon={<Icons.plus size={18} />} onClick={() => setAddFor('mate')} className="hidden sm:inline-flex">Programează o lucrare</ShimmerButton>} />

      {/* collision banner */}
      {collisions.length > 0 && (
        <motion.div initial={reduce ? false : { opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }}
          className="mb-4 flex items-start gap-3 rounded-xl2 border border-heat-heavy/25 bg-heat-heavybg/60 p-4">
          <span className="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-white text-heat-heavy shadow-sm"><Icons.alert size={18} /></span>
          <div className="text-sm">
            <p className="font-700 text-heat-heavy">Coliziune de evaluări detectată</p>
            {collisions.map((c) => (
              <p key={keyOf(c.dt)} className="mt-0.5 text-ink/75">
                <b>{fmtDay(c.dt)}</b>: {c.items.map((t) => `${SUBJ[t.subj].short} (${TYPE_LABEL[t.type].toLowerCase()})`).join(' + ')}.
                {role === 'student' ? ' Planifică revizia din timp.' : ' Ia în calcul o altă zi.'}
              </p>
            ))}
          </div>
        </motion.div>
      )}

      {/* heatmap */}
      <div className="space-y-4">
        {weeks.map((wk) => (
          <section key={wk} className="rounded-xl2 border border-line bg-white p-4 shadow-card sm:p-5">
            <h2 className="mb-3 text-sm font-700 text-muted">{wk === 0 ? 'Săptămâna aceasta' : 'Săptămâna viitoare'}</h2>
            <div className="grid grid-cols-5 gap-2 sm:gap-3">
              {gridDays(wk).map((d, i) => {
                const isClash = d.items.filter((t) => t.type !== 'tema').length >= 2;
                return (
                  <motion.div key={i}
                    initial={reduce ? false : { opacity: 0, scale: .92 }} animate={{ opacity: 1, scale: 1 }}
                    transition={{ delay: (wk * 5 + i) * 0.03, ...spring }}
                    className="relative flex flex-col rounded-xl p-2.5 sm:p-3"
                    style={{ background: d.heat.bg, boxShadow: isClash ? `inset 0 0 0 2px ${d.heat.ring}` : 'none' }}>
                    <div className="flex items-center justify-between">
                      <span className="text-[12px] font-700" style={{ color: d.heat.fg }}>{fmtDay(d.dt)}</span>
                      {isClash && <Icons.alert size={13} style={{ color: d.heat.fg }} />}
                    </div>
                    <div className="mt-2 flex-1 space-y-1">
                      {d.items.length === 0 && <span className="text-[11px]" style={{ color: d.heat.fg, opacity: .7 }}>liber</span>}
                      {d.items.map((t) => (
                        <div key={t.id} className="flex items-center gap-1 rounded-md bg-white/70 px-1.5 py-1 text-[10.5px] font-semibold leading-tight" style={{ color: d.heat.fg }}>
                          <SubjectDot subj={t.subj} size={6} />
                          <span className="truncate">{SUBJ[t.subj].short}</span>
                        </div>
                      ))}
                    </div>
                    <span className="mt-2 text-[10px] font-semibold uppercase tracking-wide" style={{ color: d.heat.fg, opacity: .8 }}>{d.heat.label}</span>
                  </motion.div>
                );
              })}
            </div>
          </section>
        ))}
      </div>

      {/* legend + role-aware footer */}
      <div className="mt-4 flex flex-wrap items-center gap-2">
        {[['#DEF7E6', '#0F7C39', 'ușor'], ['#FBF1CF', '#946500', 'moderat'], ['#FCE6D5', '#B14A08', 'încărcat'], ['#FBDFDF', '#AE1919', 'supraîncărcat']].map(([bg, fg, l]) => (
          <span key={l} className="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[12px] font-semibold" style={{ background: bg, color: fg }}>{l}</span>
        ))}
      </div>

      {role === 'teacher' && (
        <ShimmerButton icon={<Icons.plus size={18} />} onClick={() => setAddFor('mate')} className="mt-4 w-full sm:hidden">Programează o lucrare</ShimmerButton>
      )}

      {/* teacher: schedule-a-test flow with suggestions */}
      <Sheet open={!!addFor} onClose={() => setAddFor(null)} labelledBy="add-title">
        {addFor && (
          <motion.div initial={{ opacity: 0, y: 24, scale: .98 }} animate={{ opacity: 1, y: 0, scale: 1 }} exit={{ opacity: 0, y: 24, scale: .98 }} transition={spring}
            className="relative z-10 w-full max-w-md rounded-t-xl2 bg-white p-6 shadow-lift sm:rounded-xl2">
            <div className="h-1.5 w-10 mx-auto mb-4 rounded-full bg-line sm:hidden" />
            <h3 id="add-title" className="font-display text-xl font-700">Programează o lucrare la 10B</h3>
            <p className="mt-1 text-sm text-muted">SchoolPilot verifică mai întâi cât de încărcată e clasa.</p>
            <p className="mt-5 mb-2 text-[13px] font-700 text-heat-calm">Zile recomandate (clasa e liberă)</p>
            <div className="space-y-2">
              {suggestions.map((d) => (
                <div key={keyOf(d.dt)} className="flex items-center justify-between rounded-xl p-3" style={{ background: d.heat.bg }}>
                  <span className="font-semibold" style={{ color: d.heat.fg }}>{fmtDay(d.dt)} · {d.heat.label}</span>
                  <button onClick={() => setAddFor(null)} className="rounded-lg bg-white px-3 py-1.5 text-[13px] font-semibold text-ink shadow-pill ring-1 ring-line hover:bg-paper">Alege</button>
                </div>
              ))}
            </div>
            <button onClick={() => setAddFor(null)} className="mt-5 w-full rounded-xl border border-line py-2.5 font-semibold text-muted hover:bg-paper">Anulează</button>
          </motion.div>
        )}
      </Sheet>
    </div>
  );

function GradesPanel() {
  const subjects = Object.keys(GRADES);
  const [open, setOpen] = useState(null);
  const overall = round2(mean(subjects.map((s) => mean(GRADES[s].map((g) => g.v)))));
  const animOverall = useCountUp(overall);
  return (
    <div>
      <div className="mb-4 grid grid-cols-2 gap-3 sm:grid-cols-4">
        <StatTile label="Media generală" value={animOverall.toFixed(2)} tone="#4B3BE8" icon={<Icons.target size={16} />} />
        <StatTile label="Materii" value={subjects.length} tone="#0E8FB0" icon={<Icons.book size={16} />} />
        <StatTile label="Cea mai bună" value={SUBJ.eng.short} tone="#16A34A" icon={<Icons.spark size={16} />} sub="media 9.67" />
        <StatTile label="De urmărit" value={SUBJ.fiz.short} tone="#D92626" icon={<Icons.alert size={16} />} sub="media 5.50" />
      </div>
      <div className="grid grid-cols-1 gap-3 md:grid-cols-2">
        {subjects.map((s) => {
          const vals = GRADES[s].map((g) => g.v);
          const avg = round2(mean(vals));
          const risk = avg < 6;

function WhatINeed({ subj, grades }) {
  const [target, setTarget] = useState(Math.min(10, Math.ceil(mean(grades)) + 1 || 8));
  const [n, setN] = useState(1);
  const need = whatINeed(grades, target, n);
  const reachable = need <= 10;
  const trivial = need <= 1;
  return (
    <div>
      <p className="flex items-center gap-2 text-sm font-700"><Icons.target size={16} className="text-brand" /> De ce notă ai nevoie?</p>
      <div className="mt-3 flex flex-wrap items-center gap-4">

          <label className="text-[12px] text-muted">Media dorită</label>
          <div className="mt-1 flex items-center gap-2">
            <Stepper value={target} set={(v) => setTarget(Math.max(1, Math.min(10, v)))} />
          </div>
        </div>
        <div>
          <label className="text-[12px] text-muted">Note rămase</label>
          <div className="mt-1 flex items-center gap-2">
            <Stepper value={n} set={(v) => setN(Math.max(1, Math.min(5, v)))} />
          </div>
        </div>
      </div>
      <motion.div key={`${target}-${n}-${reachable}`} initial={{ opacity: 0, y: 6 }} animate={{ opacity: 1, y: 0 }}
        className={cx('mt-4 rounded-xl p-3.5 text-sm', !reachable ? 'bg-heat-heavybg text-heat-heavy' : trivial ? 'bg-heat-calmbg text-heat-calm' : 'bg-brand-50 text-brand-600')}>
        {!reachable ? (
          <span>Media <b>{target}</b> nu mai e posibilă cu {n} {n === 1 ? 'notă' : 'note'} — ar trebui peste 10. Mărește numărul de note sau coboară ținta.</span>
        ) : trivial ? (
          <span>Ești deja acolo 🎉 Chiar și o notă mică îți păstrează media <b>{target}</b>.</span>

          <span>Ai nevoie de minim <b className="font-display text-base">{Math.ceil(need * 100) / 100}</b> la {n === 1 ? 'următoarea notă' : `fiecare din următoarele ${n} note`} ca să ajungi la media <b>{target}</b>.</span>
        )}
      </motion.div>
    </div>
  );
}

/* simple heuristic "AI" parser: messy teacher text -> structured tasks */
function parseToTasks(text) {
  const DOW = { luni: 0, marți: 1, marti: 1, miercuri: 2, joi: 3, vineri: 4 };
  const lines = text.split(/\n|(?<=[.!?])\s+(?=[A-ZĂÂÎȘȚ])/).map((l) => l.trim()).filter((l) => l.length > 3);
  return lines.map((line, i) => {
    const low = line.toLowerCase();
    let type = 'tema';
    if (/(lucrare|test|teză|teza|examen)/.test(low)) type = 'test';
    else if (/(ascultare|oral|verific)/.test(low)) type = 'quiz';
    let day = null;
    for (const k in DOW) if (low.includes(k)) { day = DOW[k]; break; }
    let dateLabel = null;
    const dm = low.match(/\b(\d{1,2})[.\/](\d{1,2})\b/);
    const dnum = low.match(/\bpe (\d{1,2})\b|\bpân[ăa] (?:pe )?(\d{1,2})\b/);
    if (day != null) dateLabel = fmtDay(addDays(WEEK_MON, day));
    else if (dm) dateLabel = `${dm[1]}.${dm[2]}`;
    else if (dnum) dateLabel = `${dnum[1] || dnum[2]} nov`;
    const pages = low.match(/pag\.?\s*(\d+[\s–\-]*\d*)/);
    return { id: i, title: line.length > 90 ? line.slice(0, 88) + '…' : line, type, dateLabel, pages: pages ? pages[1] : null };
  });
}

 * ------------------------------------------------------------------ */
const NAV = [
  { id: 'today', label: 'Azi', icon: Icons.sun },
  { id: 'timetable', label: 'Orar', icon: Icons.grid },
  { id: 'workload', label: 'Încărcare', icon: Icons.pulse },
  { id: 'marks', label: 'Catalog', icon: Icons.chart },
  { id: 'inbox', label: 'Mesaje', icon: Icons.inbox },
];
const ROLES = { student: 'Elev', teacher: 'Profesor', parent: 'Părinte' };

function App() {
  const [view, setView] = useState('today');
  const [role, setRole] = useState('student');
  const [roleOpen, setRoleOpen] = useState(false);
  const [privOpen, setPrivOpen] = useState(false);
  const reduce = useReducedMotion();

  // hash routing for the handful of top views
  useEffect(() => {
    const apply = () => { const h = location.hash.replace('#', ''); if (NAV.some((n) => n.id === h)) setView(h); };
    apply();
    window.addEventListener('hashchange', apply);
    return () => window.removeEventListener('hashchange', apply);
  }, []);
  const goto = (v) => { setView(v); if (history.replaceState) history.replaceState(null, '', '#' + v); };

  const effectiveNav = NAV; // all roles see the same 5 for the MVP demo

  const Views = {
    today: <TodayView role={role} onGoto={goto} />,
    timetable: <TimetableView />,
    workload: <WorkloadView role={role} />,
    marks: <MarksView />,
    inbox: <InboxView />,
  };

  return (
    <MotionConfig reducedMotion="user">
      <div className="graph-paper min-h-screen">
        <div className="flex">
          {/* desktop rail */}
          <aside className="sticky top-0 hidden h-screen w-[232px] shrink-0 flex-col border-r border-line bg-white/70 px-3 py-5 backdrop-blur lg:flex">
            <div className="flex items-center gap-2.5 px-2">
              <Logo />
              <div className="leading-none">
                <p className="font-display text-lg font-800 tracking-tight">SchoolPilot</p>
                <p className="mt-0.5 text-[11px] text-muted">Clasa 10B</p>
              </div>
            </div>
            <nav className="mt-7 flex flex-col gap-1">
              {effectiveNav.map((n) => {
                const on = view === n.id;
                return (
                  <button key={n.id} onClick={() => goto(n.id)}
                    className={cx('group relative flex items-center gap-3 rounded-xl px-3 py-2.5 text-[14.5px] font-semibold transition-colors', on ? 'text-brand-600' : 'text-muted hover:bg-paper hover:text-ink')}>
                    {on && <motion.span layoutId="rail-active" transition={spring} className="absolute inset-0 rounded-xl bg-brand-50 ring-1 ring-brand-100" />}
                    <span className="relative z-10"><n.icon size={20} /></span>
                    <span className="relative z-10">{n.label}</span>
                  </button>
                );
              })}
            </nav>
            <div className="mt-auto space-y-1">
              <button onClick={() => setPrivOpen(true)} className="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-[13.5px] font-semibold text-muted transition-colors hover:bg-paper hover:text-ink">
                <Icons.shield size={19} /> Confidențialitate
              </button>
              <RolePicker role={role} setRole={setRole} open={roleOpen} setOpen={setRoleOpen} />
            </div>
          </aside>

          {/* main */}
          <main className="min-w-0 flex-1">
            {/* mobile top bar */}
            <header className="sticky top-0 z-30 flex items-center justify-between border-b border-line bg-white/80 px-4 py-3 backdrop-blur lg:hidden" style={{ paddingTop: 'max(0.75rem, env(safe-area-inset-top))' }}>
              <div className="flex items-center gap-2"><Logo size={30} /><span className="font-display text-base font-800">SchoolPilot</span></div>
              <div className="flex items-center gap-1.5">
                <button onClick={() => setPrivOpen(true)} className="grid h-9 w-9 place-items-center rounded-lg text-muted hover:bg-paper"><Icons.shield size={19} /></button>
                <button onClick={() => setRoleOpen(true)} className="inline-flex items-center gap-1.5 rounded-full bg-paper px-2.5 py-1.5 text-[12.5px] font-700"><Icons.user size={14} /> {ROLES[role]}</button>
              </div>
            </header>

            <AnimatePresence mode="wait">
              <motion.div key={view}
                initial={reduce ? false : { opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} exit={reduce ? {} : { opacity: 0, y: -8 }}
                transition={{ duration: .22 }}>
                {Views[view]}
              </motion.div>
            </AnimatePresence>
          </main>
        </div>

        {/* mobile bottom bar */}
        <nav className="fixed inset-x-0 bottom-0 z-30 border-t border-line bg-white/90 backdrop-blur lg:hidden" style={{ paddingBottom: 'env(safe-area-inset-bottom)' }}>
          <div className="mx-auto flex max-w-md items-stretch justify-around px-2 py-1.5">
            {effectiveNav.map((n) => {
              const on = view === n.id;
              return (
                <button key={n.id} onClick={() => goto(n.id)} className="relative flex flex-1 flex-col items-center gap-0.5 rounded-xl py-1.5">
                  {on && <motion.span layoutId="tab-active" transition={spring} className="absolute inset-x-2 top-0 h-1 rounded-full bg-brand" />}
                  <n.icon size={21} className={on ? 'text-brand' : 'text-muted'} fill={false} />
                  <span className={cx('text-[10.5px] font-semibold', on ? 'text-brand' : 'text-muted')}>{n.label}</span>
                </button>
              );
            })}
          </div>
        </nav>

        {/* mobile role picker as a sheet */}
        <Sheet open={roleOpen} onClose={() => setRoleOpen(false)} labelledBy="role-title">
          {roleOpen && (
            <motion.div initial={{ opacity: 0, y: 24 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: 24 }} transition={spring}
              className="relative z-10 w-full max-w-md rounded-t-xl2 bg-white p-6 shadow-lift sm:rounded-xl2 lg:hidden">
              <div className="h-1.5 w-10 mx-auto mb-4 rounded-full bg-line" />
              <h3 id="role-title" className="font-display text-lg font-700">Schimbă rolul</h3>
              <p className="text-[13px] text-muted">Aceeași aplicație, vedere adaptată.</p>
              <div className="mt-4 grid grid-cols-3 gap-2">
                {Object.keys(ROLES).map((r) => (
                  <button key={r} onClick={() => { setRole(r); setRoleOpen(false); }}
                    className={cx('rounded-xl border p-3 text-sm font-700 transition-colors', role === r ? 'border-brand bg-brand-50 text-brand-600' : 'border-line hover:bg-paper')}>
                    <Icons.user size={18} className="mx-auto mb-1" />{ROLES[r]}
                  </button>
                ))}
              </div>
            </motion.div>
          )}
        </Sheet>

        <PrivacySheet open={privOpen} onClose={() => setPrivOpen(false)} />
      </div>
    </MotionConfig>
  );
}

function RolePicker({ role, setRole, open, setOpen }) {
  return (
    <div className="relative">
      <button onClick={() => setOpen(!open)} className="flex w-full items-center gap-3 rounded-xl border border-line bg-white px-3 py-2.5 text-left transition-colors hover:bg-paper">
        <span className="grid h-8 w-8 place-items-center rounded-lg bg-brand-50 text-brand-600"><Icons.user size={17} /></span>
        <span className="flex-1"><span className="block text-[13px] font-700">Ana Popescu</span><span className="block text-[11px] text-muted">{ROLES[role]}</span></span>
        <Icons.chevD size={16} className={cx('text-muted transition-transform', open && 'rotate-180')} />
      </button>
      <AnimatePresence>
        {open && (
          <motion.div initial={{ opacity: 0, y: 6 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: 6 }}
            className="absolute bottom-full left-0 mb-2 w-full overflow-hidden rounded-xl border border-line bg-white p-1 shadow-lift">
            {Object.keys(ROLES).map((r) => (
              <button key={r} onClick={() => { setRole(r); setOpen(false); }}
                className={cx('flex w-full items-center gap-2 rounded-lg px-3 py-2 text-[13.5px] font-semibold transition-colors', role === r ? 'bg-brand-50 text-brand-600' : 'hover:bg-paper')}>
                <Icons.user size={16} /> {ROLES[r]} {role === r && <Icons.check size={15} className="ml-auto" />}
              </button>
            ))}
          </motion.div>
        )}
      </AnimatePresence>
    </div>
  );
}

function Logo({ size = 36 }) {
  return (
    <span className="grid shrink-0 place-items-center rounded-xl bg-brand text-white shadow-card" style={{ width: size, height: size }}>
      <svg width={size * 0.56} height={size * 0.56} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M3 8l9-5 9 5-9 5z" /><path d="M7 10v5c0 1.5 2.5 3 5 3s5-1.5 5-3v-5" />
      </svg>
    </span>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
