<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>SchoolPilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script>window.process = window.process || { env: { NODE_ENV: 'production' } };</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/framer-motion@11.11.17/dist/framer-motion.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['"Bricolage Grotesque"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
        },
        fontWeight: { 400: '400', 500: '500', 600: '600', 700: '700', 800: '800' },
        colors: {
          ink: '#161932', paper: '#EDF0F7', line: '#E3E7F1',
          brand: { DEFAULT: '#4B3BE8', 600: '#3A2BCF', 50: '#EEECFF', 100: '#E1DEFF', 200: '#C8C2FF' },
          muted: '#636B86',
          heat: { calm: '#15A34A', calmbg: '#DEF7E6', light: '#C98A04', lightbg: '#FBF1CF',
                  busy: '#E8650E', busybg: '#FCE6D5', heavy: '#D92626', heavybg: '#FBDFDF' },
        },
        boxShadow: {
          card: '0 1px 2px rgba(22,25,50,.04), 0 6px 20px -8px rgba(22,25,50,.12)',
          lift: '0 10px 40px -12px rgba(22,25,50,.28)', pill: '0 1px 2px rgba(22,25,50,.10)',
        },
        borderRadius: { xl2: '1.25rem' },
      },
    },
  };
</script>
<style>
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: Inter, sans-serif; background: #EDF0F7; color: #161932; -webkit-font-smoothing: antialiased; }
  .font-display { font-family: "Bricolage Grotesque", sans-serif; }
  .tnum { font-variant-numeric: tabular-nums; }
  .graph-paper {
    background-color: #EDF0F7;
    background-image: linear-gradient(to right, rgba(75,59,232,.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(75,59,232,.045) 1px, transparent 1px);
    background-size: 26px 26px;
  }
  .highlight { background: linear-gradient(104deg, rgba(253,224,71,0) .3%, rgba(253,224,71,.7) 2.4%, rgba(253,224,71,.55) 95%, rgba(253,224,71,0) 99%);
    border-radius: .3em; padding: 0 .12em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #C9D0E0; border-radius: 999px; border: 3px solid transparent; background-clip: content-box; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  *:focus-visible { outline: 2px solid #4B3BE8; outline-offset: 2px; border-radius: 6px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback, useContext, createContext } = React;
const Mo = window.Motion || {};
const motion = Mo.motion, AnimatePresence = Mo.AnimatePresence, MotionConfig = Mo.MotionConfig;
const useReducedMotion = Mo.useReducedMotion || (() => false);
const spring = { type: 'spring', stiffness: 380, damping: 32, mass: 0.8 };
const cx = (...a) => a.filter(Boolean).join(' ');

const HEAT = {
  none:  { bg: '#F3F5FB', fg: '#9AA3BC', ring: 'transparent' },
  calm:  { bg: '#DEF7E6', fg: '#0F7C39', ring: '#9BE3B5' },
  light: { bg: '#FBF1CF', fg: '#946500', ring: '#E8D27A' },
  busy:  { bg: '#FCE6D5', fg: '#B14A08', ring: '#F3B483' },
  heavy: { bg: '#FBDFDF', fg: '#AE1919', ring: '#F0A3A3' },
};

/* ---------------- API ---------------- */
const jfetch = (url, opts) => fetch(url, opts).then((r) => r.json());
const API = {
  state: (role) => jfetch(`/api/state?role=${role}`),
  post: (p, b) => jfetch(p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b || {}) }),
  patch: (p, b) => jfetch(p, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b || {}) }),
  del: (p) => jfetch(p, { method: 'DELETE' }),
};

const Ctx = createContext(null);
const useApp = () => useContext(Ctx);

/* ---------------- Icons ---------------- */
const Ic = ({ size = 20, fill = false, sw = 1.75, children, ...p }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill={fill ? 'currentColor' : 'none'}
       stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" {...p}>{children}</svg>
);
const Icons = {
  sun: (p) => <Ic {...p}><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></Ic>,
  grid: (p) => <Ic {...p}><rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" /><rect x="3" y="14" width="7" height="7" rx="1.5" /><rect x="14" y="14" width="7" height="7" rx="1.5" /></Ic>,
  pulse: (p) => <Ic {...p}><path d="M3 12h4l2 6 4-14 2 8h6" /></Ic>,
  chart: (p) => <Ic {...p}><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></Ic>,
  inbox: (p) => <Ic {...p}><path d="M22 12h-6l-2 3h-4l-2-3H2" /><path d="M5.5 5h13l3.5 7v5a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-5z" /></Ic>,
  bell: (p) => <Ic {...p}><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.7 21a2 2 0 0 1-3.4 0" /></Ic>,
  chat: (p) => <Ic {...p}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /></Ic>,
  check: (p) => <Ic {...p}><path d="M20 6 9 17l-5-5" /></Ic>,
  plus: (p) => <Ic {...p}><path d="M12 5v14M5 12h14" /></Ic>,
  chevR: (p) => <Ic {...p}><path d="m9 18 6-6-6-6" /></Ic>,
  chevD: (p) => <Ic {...p}><path d="m6 9 6 6 6-6" /></Ic>,
  alert: (p) => <Ic {...p}><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" /><path d="M12 9v4M12 17h.01" /></Ic>,
  bag: (p) => <Ic {...p}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" /><path d="M3 6h18M16 10a4 4 0 0 1-8 0" /></Ic>,
  clock: (p) => <Ic {...p}><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></Ic>,
  lock: (p) => <Ic {...p}><rect x="4" y="11" width="16" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></Ic>,
  shield: (p) => <Ic {...p}><path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5z" /></Ic>,
  user: (p) => <Ic {...p}><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></Ic>,
  spark: (p) => <Ic {...p}><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8" /></Ic>,
  magic: (p) => <Ic {...p}><path d="m5 19 9-9M13 4l1 3 3 1-3 1-1 3-1-3-3-1 3-1zM19 13l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6z" /></Ic>,
  x: (p) => <Ic {...p}><path d="M18 6 6 18M6 6l12 12" /></Ic>,
  moon: (p) => <Ic {...p}><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></Ic>,
  book: (p) => <Ic {...p}><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" /></Ic>,
  pin: (p) => <Ic {...p}><path d="M9 4h6l-1 7 4 3H6l4-3z" /><path d="M12 14v6" /></Ic>,
  target: (p) => <Ic {...p}><circle cx="12" cy="12" r="9" /><circle cx="12" cy="12" r="5" /><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none" /></Ic>,
  dot: (p) => <Ic {...p} fill><circle cx="12" cy="12" r="4" /></Ic>,
  send: (p) => <Ic {...p}><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z" /></Ic>,
  camera: (p) => <Ic {...p}><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" /><circle cx="12" cy="13" r="4" /></Ic>,
  minus: (p) => <Ic {...p}><path d="M5 12h14" /></Ic>,
  calendar: (p) => <Ic {...p}><rect x="3" y="4" width="18" height="18" rx="2" /><path d="M16 2v4M8 2v4M3 10h18" /></Ic>,
  trash: (p) => <Ic {...p}><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /></Ic>,
};

/* ---------------- primitives ---------------- */
function SubjectDot({ code, size = 10 }) {
  const { data } = useApp();
  const hue = (data.subjects[code] || {}).hue || '#636B86';
  return <span className="inline-block rounded-full shrink-0" style={{ width: size, height: size, background: hue }} />;
}
function Pill({ children, tone = 'muted', className }) {
  const tones = { muted: 'bg-paper text-muted', brand: 'bg-brand-50 text-brand-600', heavy: 'text-heat-heavy' };
  return <span className={cx('inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-[11px] font-700', tones[tone], className)}>{children}</span>;
}
function FluidTabs({ tabs, active, onChange, id, size = 'md' }) {
  const pad = size === 'sm' ? 'px-3 py-1.5 text-[13px]' : 'px-4 py-2 text-sm';
  return (
    <div className="relative inline-flex items-center gap-1 rounded-full border border-line bg-white/70 p-1 shadow-pill backdrop-blur">
      {tabs.map((t) => {
        const on = active === t.id;
        return (
          <button key={t.id} onClick={() => onChange(t.id)}
            className={cx('relative rounded-full font-700 transition-colors', pad, on ? 'text-ink' : 'text-muted hover:text-ink')}>
            {on && <motion.span layoutId={`fluid-${id}`} transition={spring} className="absolute inset-0 rounded-full bg-brand-50 ring-1 ring-brand-100" />}
            <span className="relative z-10 inline-flex items-center gap-1.5">{t.icon}{t.label}</span>
          </button>
        );
      })}
    </div>
  );
}
function ShimmerButton({ children, className, icon, ...p }) {
  return (
    <button {...p} className={cx('group relative overflow-hidden rounded-xl bg-brand px-4 py-2.5 font-700 text-white shadow-card transition-all hover:bg-brand-600 active:scale-[.98] disabled:opacity-50', className)}>
      <span className="relative z-10 inline-flex items-center justify-center gap-2">{icon}{children}</span>
      <span className="pointer-events-none absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-white/30 to-transparent transition-transform duration-700 group-hover:translate-x-full" />
    </button>
  );
}
function Sheet({ open, onClose, children, labelledBy }) {
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
  }, [open]);
  return (
    <AnimatePresence>
      {open && (
        <div className="fixed inset-0 z-50 flex items-end justify-center sm:items-center sm:p-6" role="dialog" aria-modal="true" aria-labelledby={labelledBy}>
          <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} onClick={onClose} className="absolute inset-0 bg-ink/40 backdrop-blur-sm" />
          {children}
        </div>
      )}
    </AnimatePresence>
  );
}
function Stepper({ value, set, min = 1, max = 10 }) {
  return (
    <div className="inline-flex items-center gap-1 rounded-xl border border-line bg-white p-1">
      <button onClick={() => set(Math.max(min, value - 1))} className="grid h-8 w-8 place-items-center rounded-lg text-muted hover:bg-paper active:scale-95" aria-label="minus"><Icons.minus size={16} /></button>
      <span className="w-8 text-center font-display text-lg font-700 tnum">{value}</span>
      <button onClick={() => set(Math.min(max, value + 1))} className="grid h-8 w-8 place-items-center rounded-lg text-muted hover:bg-paper active:scale-95" aria-label="plus"><Icons.plus size={16} /></button>
    </div>
  );
}
function StatTile({ label, value, tone, icon, sub }) {
  return (
    <div className="rounded-xl2 border border-line bg-white p-4 shadow-card">
      <div className="flex items-center gap-2 text-muted"><span style={{ color: tone }}>{icon}</span><span className="text-[12px] font-600">{label}</span></div>
      <div className="mt-1.5 font-display text-2xl font-700 tnum" style={{ color: tone }}>{value}</div>
      {sub && <div className="mt-0.5 text-[11.5px] text-muted">{sub}</div>}
    </div>
  );
}
function Spinner({ size = 16 }) {
  return <motion.span animate={{ rotate: 360 }} transition={{ repeat: Infinity, duration: .8, ease: 'linear' }} className="inline-block">
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="3" strokeOpacity=".25" /><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" strokeWidth="3" strokeLinecap="round" /></svg>
  </motion.span>;
}
function ViewHead({ title, sub, icon, right, bare }) {
  return (
    <div className={cx('flex items-end justify-between gap-3', !bare && 'mb-4')}>
      <div className="flex items-center gap-3">
        <span className="hidden h-11 w-11 place-items-center rounded-xl bg-white text-brand shadow-card sm:grid">{icon}</span>
        <div>
          <h1 className="font-display text-2xl font-700 leading-none sm:text-[28px]">{title}</h1>
          <p className="mt-1 text-[13.5px] text-muted">{sub}</p>
        </div>
      </div>
      {right}
    </div>
  );
}
function useCountUp(value, dur = 700) {
  const [v, setV] = useState(value);
  const reduce = useReducedMotion();
  const prev = useRef(value);
  useEffect(() => {
    if (reduce) { setV(value); prev.current = value; return; }
    const from = prev.current, to = value, t0 = performance.now();
    let raf;
    const tick = (t) => {
      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      setV(from + (to - from) * e);
      if (p < 1) raf = requestAnimationFrame(tick); else prev.current = to;
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [value]);
  return v;
}

/* ================= TODAY ================= */
function TodayView({ onGoto }) {
  const { data, mutate } = useApp();
  const reduce = useReducedMotion();
  const S = data.subjects;
  const t = data.today;
  const dueSoon = data.tasks.filter((x) => x.bucket === 'today' || x.bucket === 'tomorrow');
  const newAnns = data.announcements.slice(0, 2);
  const collision = data.workload.collisions[0];
  const [adding, setAdding] = useState(false);
  const [draft, setDraft] = useState('');
  const stagger = (i) => reduce ? {} : { initial: { opacity: 0, y: 14 }, animate: { opacity: 1, y: 0 }, transition: { delay: 0.05 + i * 0.07, ...spring } };

  const toggle = (task) => mutate(API.patch(`/api/tasks/${task.id}`, { done: !task.done }));
  const addTask = () => {
    const title = draft.trim(); if (!title) { setAdding(false); return; }
    setDraft(''); setAdding(false);
    mutate(API.post('/api/tasks', { title, type: 'tema', due: new Date().toISOString().slice(0, 10) }));
  };

  return (
    <div className="mx-auto w-full max-w-[1120px] px-4 pb-28 pt-5 sm:px-6 lg:pb-10">
      <motion.header {...stagger(0)} className="relative overflow-hidden rounded-xl2 bg-ink p-6 text-white shadow-lift sm:p-8">
        <div className="pointer-events-none absolute -right-16 -top-16 h-56 w-56 rounded-full bg-brand/40 blur-3xl" />
        <div className="pointer-events-none absolute right-24 top-10 h-24 w-24 rounded-full bg-[#FDE047]/20 blur-2xl" />
        <div className="relative">
          <p className="flex items-center gap-2 text-sm font-500 text-white/60"><Icons.sun size={16} /> {t.dateLabel} · Clasa {data.student.class}</p>
          <h1 className="mt-2 font-display text-[28px] font-700 leading-tight sm:text-[38px]">
            Bună, {data.student.name.split(' ')[0]}. Azi ai <span className="highlight text-ink">{t.classes.length} ore</span> și <span className="highlight text-ink">{dueSoon.length} de predat</span> curând.
          </h1>
          <p className="mt-2 max-w-xl text-[15px] text-white/70">Săptămâna nu te mai prinde pe picior greșit — iată tot ce contează, pus în ordine.</p>
          <div className="mt-5 flex flex-wrap items-center gap-3">
            <ShimmerButton icon={<Icons.grid size={18} />} onClick={() => onGoto('timetable')}>Vezi orarul de azi</ShimmerButton>
            <button onClick={() => onGoto('workload')} className="inline-flex items-center gap-2 rounded-xl border border-white/20 bg-white/5 px-4 py-2.5 font-700 text-white hover:bg-white/10"><Icons.pulse size={18} /> Cum arată săptămâna</button>
          </div>
        </div>
      </motion.header>

      {collision && (
        <motion.button {...stagger(1)} onClick={() => onGoto('workload')}
          className="group mt-4 flex w-full items-center gap-3 rounded-2xl border border-heat-heavy/25 bg-heat-heavybg/70 p-4 text-left hover:bg-heat-heavybg">
          <span className="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-white text-heat-heavy shadow-sm"><Icons.alert size={20} /></span>
          <span className="min-w-0 flex-1">
            <span className="block text-sm font-700 text-heat-heavy">Săptămâna asta se aglomerează</span>
            <span className="block truncate text-[13px] text-ink/70">{collision.dateLabel}: {collision.items.length} evaluări în aceeași zi. Începe revizia din weekend.</span>
          </span>
          <Icons.chevR className="shrink-0 text-heat-heavy/70 transition-transform group-hover:translate-x-0.5" />
        </motion.button>
      )}

      <div className="mt-5 grid grid-cols-1 gap-4 lg:grid-cols-3">
        <motion.section {...stagger(2)} className="lg:col-span-2 rounded-xl2 border border-line bg-white p-5 shadow-card">
          <div className="mb-4 flex items-center justify-between">
            <h2 className="font-display text-lg font-700">Programul de azi</h2>
            {t.isWeekend && <Pill tone="muted">weekend · previzualizare luni</Pill>}
          </div>
          <ol className="relative">
            <span className="absolute left-[62px] top-2 bottom-2 w-px bg-line" />
            {t.classes.map((c, i) => (
              <li key={i} className="relative flex items-stretch gap-4 py-1.5">
                <div className="w-12 shrink-0 pt-1 text-right text-[13px] font-600 tnum text-muted">{c.time}</div>
                <div className="relative z-10 mt-1.5 grid place-items-center"><span className={cx('h-3 w-3 rounded-full ring-4 ring-white', c.current ? 'bg-brand' : 'bg-line')} /></div>
                <div className={cx('flex min-w-0 flex-1 items-center justify-between rounded-xl px-3.5 py-2.5', c.current ? 'bg-brand-50 ring-1 ring-brand-100' : 'hover:bg-paper')}>
                  <div className="min-w-0">
                    <div className="flex items-center gap-2"><SubjectDot code={c.subject} /><span className="truncate font-700">{c.name}</span>{c.current && <Pill tone="brand">acum</Pill>}</div>
                    <div className="mt-0.5 text-[12.5px] text-muted">{c.teacher}</div>
                  </div>
                  <span className="ml-3 shrink-0 rounded-lg bg-white px-2 py-1 text-[12px] font-700 text-ink shadow-pill ring-1 ring-line">{c.room}</span>
                </div>
              </li>
            ))}
          </ol>
        </motion.section>

        <div className="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-1">
          <motion.section {...stagger(3)} className="rounded-xl2 border border-line bg-white p-5 shadow-card">
            <div className="mb-3 flex items-center justify-between">
              <h2 className="font-display text-lg font-700">De predat curând</h2>
              <button onClick={() => setAdding(true)} className="inline-flex items-center gap-1 text-[13px] font-700 text-brand hover:text-brand-600"><Icons.plus size={14} /> adaugă</button>
            </div>
            {adding && (
              <div className="mb-2 flex items-center gap-2">
                <input autoFocus value={draft} onChange={(e) => setDraft(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') addTask(); if (e.key === 'Escape') { setAdding(false); setDraft(''); } }}
                  placeholder="Ce ai de făcut?" className="flex-1 rounded-lg border border-line px-3 py-2 text-sm outline-none focus:border-brand" />
                <button onClick={addTask} className="rounded-lg bg-brand px-3 py-2 text-sm font-700 text-white hover:bg-brand-600">Adaugă</button>
              </div>
            )}
            <ul className="space-y-1">
              <AnimatePresence initial={false}>

function WhatINeed({ subject, avg }) {
  const { mutate } = useApp();
  const [target, setTarget] = useState(Math.min(10, Math.ceil(avg) + 1));
  const [n, setN] = useState(1);
  const [res, setRes] = useState(null);
  const [newGrade, setNewGrade] = useState(Math.round(avg));
  useEffect(() => {
    const id = setTimeout(() => { API.post('/api/grades/what-if', { subject, target, n }).then(setRes); }, 160);
    return () => clearTimeout(id);
  }, [subject, target, n]);
  return (
    <div>
      <p className="flex items-center gap-2 text-sm font-700"><Icons.target size={16} className="text-brand" /> De ce notă ai nevoie?</p>
      <div className="mt-3 flex flex-wrap items-center gap-4">
        <div><label className="text-[12px] text-muted">Media dorită</label><div className="mt-1"><Stepper value={target} set={setTarget} /></div></div>
        <div><label className="text-[12px] text-muted">Note rămase</label><div className="mt-1"><Stepper value={n} set={setN} max={5} /></div></div>
      </div>
      {res && (
        <motion.div key={`${target}-${n}-${res.reachable}-${res.trivial}`} initial={{ opacity: 0, y: 6 }} animate={{ opacity: 1, y: 0 }}
          className={cx('mt-4 rounded-xl p-3.5 text-sm', !res.reachable ? 'bg-heat-heavybg text-heat-heavy' : res.trivial ? 'bg-heat-calmbg text-heat-calm' : 'bg-brand-50 text-brand-600')}>
          {!res.reachable ? <span>Media <b>{target}</b> nu mai e posibilă cu {n} {n === 1 ? 'notă' : 'note'} — ar trebui peste 10. Mărește numărul de note sau coboară ținta.</span>
            : res.trivial ? <span>Ești deja acolo 🎉 Chiar și o notă mică îți păstrează media <b>{target}</b>.</span>
            : <span>Ai nevoie de minim <b className="font-display text-base">{res.need}</b> la {n === 1 ? 'următoarea notă' : `fiecare din următoarele ${n} note`} ca să ajungi la media <b>{target}</b>.</span>}
        </motion.div>
      )}
      <div className="mt-4 flex items-center gap-2 border-t border-line pt-4">
        <span className="text-[12px] text-muted">Adaugă o notă primită:</span>
        <Stepper value={newGrade} set={setNewGrade} />
        <button onClick={() => mutate(API.post('/api/grades', { subject, value: newGrade }))} className="rounded-lg bg-ink px-3 py-2 text-[13px] font-700 text-white hover:bg-ink/90">Salvează</button>
      </div>
    </div>
  );
}

      <AnimatePresence mode="wait">
        {tab === 'ann'
          ? <motion.div key="ann" initial={{ opacity: 0, y: 8 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -8 }} transition={{ duration: .2 }}><AnnouncementsPanel /></motion.div>
          : <motion.div key="chat" initial={{ opacity: 0, y: 8 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -8 }} transition={{ duration: .2 }}><ChatPanel /></motion.div>}
      </AnimatePresence>
    </div>
  );
}
function AnnouncementsPanel() {
  const { data, mutate } = useApp();
  const SAMPLE = 'Lucrarea de joi acoperă funcția de gradul I și II. Rezolvați fișa de la pag. 48-49 până joi. Vineri avem ascultare la geografie. Nu uitați eseul despre Ion până miercuri.';
  const [text, setText] = useState(SAMPLE);
  const [tasks, setTasks] = useState(null);
  const [busy, setBusy] = useState(false);
  const [imported, setImported] = useState(false);
  const [sel, setSel] = useState(null);
  const run = () => { setBusy(true); setTasks(null); setImported(false); API.post('/api/parse', { text }).then((r) => { setTasks(r.tasks); setBusy(false); }); };
  const importAll = () => { mutate(API.post('/api/tasks/import', { tasks })); setImported(true); };
  return (
    <div className="grid grid-cols-1 gap-4 lg:grid-cols-5">
      <section className="lg:col-span-2 rounded-xl2 border border-brand-100 bg-gradient-to-b from-brand-50/70 to-white p-5 shadow-card">
        <h2 className="flex items-center gap-2 font-display text-lg font-700"><span className="grid h-7 w-7 place-items-center rounded-lg bg-brand text-white"><Icons.magic size={16} /></span> Din mesaj → sarcini</h2>
        <p className="mt-1 text-[13px] text-muted">Lipește un mesaj de pe grup sau o poză cu tabla. SchoolPilot scoate ce ai de făcut și pune datele.</p>
        <textarea value={text} onChange={(e) => setText(e.target.value)} rows={5} className="mt-3 w-full resize-none rounded-xl border border-line bg-white p-3 text-[13.5px] leading-relaxed outline-none focus:border-brand" />
        <div className="mt-3 flex items-center gap-2">
          <ShimmerButton icon={busy ? <Spinner /> : <Icons.spark size={16} />} onClick={run} disabled={busy} className="flex-1">{busy ? 'Analizez…' : 'Transformă în sarcini'}</ShimmerButton>
          <button className="grid h-11 w-11 shrink-0 place-items-center rounded-xl border border-line bg-white text-muted hover:bg-paper" title="Încarcă o poză"><Icons.camera size={18} /></button>
        </div>
        <AnimatePresence mode="wait">
          {tasks && (
            <motion.div key="res" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="mt-4">
              <p className="mb-2 text-[12px] font-700 text-brand-600">{tasks.length} sarcini găsite</p>
              <ul className="space-y-2">
                {tasks.map((t, i) => (
                  <motion.li key={i} initial={{ opacity: 0, x: -10 }} animate={{ opacity: 1, x: 0 }} transition={{ delay: i * 0.08, ...spring }} className="flex items-start gap-2.5 rounded-xl border border-line bg-white p-3">
                    <span className="mt-0.5 grid h-5 w-5 place-items-center rounded-md border-2 border-line" />
                    <div className="min-w-0 flex-1">
                      <p className="text-[13.5px] font-600 leading-snug">{t.title}</p>
                      <div className="mt-1.5 flex flex-wrap items-center gap-1.5">
                        <Pill tone={t.type === 'test' ? 'heavy' : 'brand'} className={t.type === 'test' ? 'bg-heat-heavybg' : ''}>{t.typeLabel}</Pill>
                        {t.dateLabel && <Pill><Icons.calendar size={12} /> {t.dateLabel}</Pill>}
                        {t.pages && <Pill><Icons.book size={12} /> pag. {t.pages}</Pill>}
                      </div>
                    </div>
                  </motion.li>
                ))}
              </ul>
              <button onClick={importAll} disabled={imported} className={cx('mt-3 w-full rounded-xl py-2.5 text-sm font-700 text-white transition-colors', imported ? 'bg-heat-calm' : 'bg-ink hover:bg-ink/90')}>{imported ? '✓ Adăugate în lista ta' : 'Adaugă toate în listă'}</button>
            </motion.div>
          )}
        </AnimatePresence>
      </section>

      <section className="lg:col-span-3">
        <div className="space-y-3">
          {data.announcements.map((a) => (
            <motion.button key={a.id} layoutId={`ann-${a.id}`} onClick={() => setSel(a)} className="flex w-full items-start gap-3 rounded-xl2 border border-line bg-white p-4 text-left shadow-card hover:border-brand-100">
              <motion.span layoutId={`ann-dot-${a.id}`} className="mt-1"><SubjectDot code={a.subject} size={14} /></motion.span>
              <div className="min-w-0 flex-1">
                <div className="flex items-center gap-2"><motion.span layoutId={`ann-subj-${a.id}`} className="font-700">{a.name}</motion.span>{a.pinned && <Icons.pin size={14} className="text-brand" />}{a.priority === 'urgent' && <Pill tone="heavy" className="bg-heat-heavybg">urgent</Pill>}{a.priority === 'info' && <Pill>info</Pill>}</div>
                <div className="text-[12px] text-muted">{a.teacher} · {a.when}</div>
                <p className="mt-1.5 line-clamp-2 text-[13.5px] text-ink/75">{a.text}</p>
              </div>
              <Icons.chevR size={18} className="shrink-0 text-line" />
            </motion.button>
          ))}
        </div>
      </section>

      <Sheet open={!!sel} onClose={() => setSel(null)} labelledBy="ann-title">
        {sel && (
          <motion.div layoutId={`ann-${sel.id}`} className="relative z-10 w-full max-w-lg rounded-t-xl2 bg-white p-6 shadow-lift sm:rounded-xl2">
            <div className="h-1.5 w-10 mx-auto mb-4 rounded-full bg-line sm:hidden" />
            <div className="flex items-start justify-between gap-3">
              <div className="flex items-center gap-3"><motion.span layoutId={`ann-dot-${sel.id}`}><SubjectDot code={sel.subject} size={16} /></motion.span><div><motion.h3 layoutId={`ann-subj-${sel.id}`} id="ann-title" className="font-display text-xl font-700">{sel.name}</motion.h3><p className="text-sm text-muted">{sel.teacher} · {sel.when}</p></div></div>
              <button onClick={() => setSel(null)} className="grid h-9 w-9 place-items-center rounded-full text-muted hover:bg-paper"><Icons.x size={18} /></button>
            </div>
            <p className="mt-4 text-[15px] leading-relaxed text-ink/85">{sel.text}</p>
            <div className="mt-5 flex gap-2">
              <ShimmerButton icon={<Icons.magic size={16} />} className="flex-1" onClick={() => { setText(sel.text); setSel(null); }}>Transformă în sarcini</ShimmerButton>
              <button onClick={() => setSel(null)} className="rounded-xl border border-line px-4 font-700 text-muted hover:bg-paper">Închide</button>
            </div>
          </motion.div>
        )}
      </Sheet>
    </div>
  );
}
function ChatPanel() {
  const { data, mutate, refresh } = useApp();
  const msgs = data.messages.items;
  const quiet = data.messages.quiet;
  const [draft, setDraft] = useState('');
  const endRef = useRef(null);
  useEffect(() => { endRef.current && endRef.current.scrollIntoView({ behavior: 'smooth' }); }, [msgs.length]);
  const send = () => { const t = draft.trim(); if (!t) return; setDraft(''); mutate(API.post('/api/messages', { text: t })); };
  const toggleQuiet = () => mutate(API.post('/api/settings', { quiet: !quiet }));
  return (
    <div className="mx-auto flex h-[66vh] max-w-2xl flex-col overflow-hidden rounded-xl2 border border-line bg-white shadow-card">
      <div className="flex items-center gap-3 border-b border-line p-4">
        <span className="grid h-10 w-10 place-items-center rounded-full bg-brand-50 font-display font-700 text-brand-600">AI</span>
        <div className="flex-1"><p className="font-700">d-na Ionescu</p><p className="text-[12px] text-muted">Matematică · de obicei răspunde dimineața</p></div>
        <button onClick={toggleQuiet} className={cx('inline-flex items-center gap-1.5 rounded-full px-3 py-1.5 text-[12px] font-700 transition-colors', quiet ? 'bg-ink text-white' : 'bg-paper text-muted')}><Icons.moon size={13} /> Ore liniștite {quiet ? 'on' : 'off'}</button>
      </div>
      <AnimatePresence>
        {quiet && (
          <motion.div initial={{ height: 0, opacity: 0 }} animate={{ height: 'auto', opacity: 1 }} exit={{ height: 0, opacity: 0 }} className="overflow-hidden bg-ink/[.03] px-4">
            <p className="flex items-center gap-2 py-2.5 text-[12.5px] text-muted"><Icons.moon size={14} /> Orele liniștite sunt active (21:00–07:00). Mesajele trimise noaptea ajung la profesor dimineață la <b className="text-ink">07:00</b>.</p>
          </motion.div>
        )}
      </AnimatePresence>
      <div className="flex-1 space-y-3 overflow-y-auto bg-paper/40 p-4">
        {msgs.map((m) => (
          <motion.div key={m.id} initial={{ opacity: 0, y: 8 }} animate={{ opacity: 1, y: 0 }} transition={spring} className={cx('flex', m.from === 'me' ? 'justify-end' : 'justify-start')}>
            <div className={cx('max-w-[78%] rounded-2xl px-3.5 py-2.5 text-[14px] leading-snug shadow-pill', m.from === 'me' ? 'rounded-br-md bg-brand text-white' : 'rounded-bl-md bg-white text-ink ring-1 ring-line')}>
              <p>{m.text}</p>
              <p className={cx('mt-1 flex items-center gap-1 text-[11px]', m.from === 'me' ? 'text-white/70' : 'text-muted')}>{m.scheduled && <><Icons.moon size={11} /> ajunge la {m.deliverAt} ·</>} {m.time}</p>
            </div>
          </motion.div>
        ))}
        <div ref={endRef} />
      </div>
      <div className="border-t border-line p-3">
        <div className="flex items-center gap-2 rounded-xl border border-line bg-white p-1.5 focus-within:border-brand">
          <input value={draft} onChange={(e) => setDraft(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && send()} placeholder="Scrie un mesaj politicos…" className="flex-1 bg-transparent px-2 py-1.5 text-[14px] outline-none placeholder:text-muted/70" />
          <button onClick={send} disabled={!draft.trim()} className="grid h-9 w-9 place-items-center rounded-lg bg-brand text-white hover:bg-brand-600 active:scale-95 disabled:opacity-40"><Icons.send size={16} /></button>
        </div>
      </div>
    </div>
  );
}

/* ================= Privacy ================= */
function PrivacySheet({ open, onClose }) {
  const points = [
    ['Date minime', 'Doar ce ține de școală: orar, note, anunțuri. Fără urmărire, fără reclame.'],
    ['Consimțământ parental', 'Conturile elevilor sub 16 ani se activează cu acordul unui părinte.'],
    ['Găzduit în UE', 'Datele stau pe servere din Uniunea Europeană, criptate.'],
    ['Tu controlezi', 'Elevii mari aleg ce văd părinții. Îți poți exporta sau șterge datele oricând.'],
  ];
  return (
    <Sheet open={open} onClose={onClose} labelledBy="priv-title">
      {open && (
        <motion.div initial={{ opacity: 0, y: 24, scale: .98 }} animate={{ opacity: 1, y: 0, scale: 1 }} exit={{ opacity: 0, y: 24, scale: .98 }} transition={spring} className="relative z-10 w-full max-w-md rounded-t-xl2 bg-white p-6 shadow-lift sm:rounded-xl2">
          <div className="h-1.5 w-10 mx-auto mb-4 rounded-full bg-line sm:hidden" />
          <div className="flex items-center gap-3"><span className="grid h-11 w-11 place-items-center rounded-xl bg-brand-50 text-brand"><Icons.shield size={22} /></span><h3 id="priv-title" className="font-display text-xl font-700">Confidențialitate pentru minori</h3></div>
          <ul className="mt-5 space-y-3">
            {points.map(([t, d]) => <li key={t} className="flex gap-3"><span className="mt-0.5 grid h-6 w-6 shrink-0 place-items-center rounded-full bg-heat-calmbg text-heat-calm"><Icons.check size={14} sw={3} /></span><div><p className="text-sm font-700">{t}</p><p className="text-[13px] text-muted">{d}</p></div></li>)}
          </ul>
          <button onClick={onClose} className="mt-6 w-full rounded-xl bg-ink py-2.5 font-700 text-white hover:bg-ink/90">Am înțeles</button>
        </motion.div>
      )}
    </Sheet>
  );
}

/* ================= Shell ================= */
const NAV = [
  { id: 'today', label: 'Azi', icon: Icons.sun },
  { id: 'timetable', label: 'Orar', icon: Icons.grid },
  { id: 'workload', label: 'Încărcare', icon: Icons.pulse },
  { id: 'marks', label: 'Catalog', icon: Icons.chart },
  { id: 'inbox', label: 'Mesaje', icon: Icons.inbox },
];
const ROLES = { student: 'Elev', teacher: 'Profesor', parent: 'Părinte' };

function Logo({ size = 36 }) {
  return (
    <span className="grid shrink-0 place-items-center rounded-xl bg-brand text-white shadow-card" style={{ width: size, height: size }}>
      <svg width={size * 0.56} height={size * 0.56} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 8l9-5 9 5-9 5z" /><path d="M7 10v5c0 1.5 2.5 3 5 3s5-1.5 5-3v-5" /></svg>
    </span>
  );
}
function RolePicker({ role, setRole, open, setOpen }) {
  return (
    <div className="relative">
      <button onClick={() => setOpen(!open)} className="flex w-full items-center gap-3 rounded-xl border border-line bg-white px-3 py-2.5 text-left hover:bg-paper">
        <span className="grid h-8 w-8 place-items-center rounded-lg bg-brand-50 text-brand-600"><Icons.user size={17} /></span>
        <span className="flex-1"><span className="block text-[13px] font-700">Ana Popescu</span><span className="block text-[11px] text-muted">{ROLES[role]}</span></span>
        <Icons.chevD size={16} className={cx('text-muted transition-transform', open && 'rotate-180')} />
      </button>
      <AnimatePresence>
        {open && (
          <motion.div initial={{ opacity: 0, y: 6 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: 6 }} className="absolute bottom-full left-0 mb-2 w-full overflow-hidden rounded-xl border border-line bg-white p-1 shadow-lift">
            {Object.keys(ROLES).map((r) => <button key={r} onClick={() => { setRole(r); setOpen(false); }} className={cx('flex w-full items-center gap-2 rounded-lg px-3 py-2 text-[13.5px] font-700', role === r ? 'bg-brand-50 text-brand-600' : 'hover:bg-paper')}><Icons.user size={16} /> {ROLES[r]} {role === r && <Icons.check size={15} className="ml-auto" />}</button>)}
          </motion.div>
        )}
      </AnimatePresence>
    </div>
  );
}

function Splash() {
  return <div className="graph-paper grid min-h-screen place-items-center">
    <div className="flex flex-col items-center gap-3 text-muted"><Logo size={48} /><span className="flex items-center gap-2 text-sm font-600"><Spinner size={18} /> Se încarcă SchoolPilot…</span></div>
  </div>;
}

function App() {
  const [data, setData] = useState(null);
  const [role, setRole] = useState('student');
  const [view, setView] = useState('today');
  const [roleOpen, setRoleOpen] = useState(false);
  const [privOpen, setPrivOpen] = useState(false);
  const [err, setErr] = useState(null);
  const reduce = useReducedMotion();

  const refresh = useCallback(() => API.state(role).then(setData).catch((e) => setErr(String(e))), [role]);
  useEffect(() => { refresh(); }, [refresh]);
  const mutate = useCallback((promise) => promise.then((res) => { if (res && res.today) setData(res); return res; }).catch((e) => setErr(String(e))), []);

  useEffect(() => {
    const apply = () => { const h = location.hash.replace('#', ''); if (NAV.some((n) => n.id === h)) setView(h); };
    apply(); window.addEventListener('hashchange', apply); return () => window.removeEventListener('hashchange', apply);
  }, []);
  const goto = (v) => { setView(v); try { history.replaceState(null, '', '#' + v); } catch (e) {} };

  if (err) return <div className="graph-paper grid min-h-screen place-items-center p-6"><div className="max-w-sm rounded-xl2 border border-heat-heavy/30 bg-white p-6 text-center shadow-card"><Icons.alert className="mx-auto text-heat-heavy" size={28} /><p className="mt-2 font-700">Nu am putut contacta serverul</p><p className="mt-1 text-sm text-muted">Pornește backend-ul cu <code className="rounded bg-paper px-1">python3 server.py</code>, apoi reîncarcă.</p><p className="mt-2 text-[11px] text-muted">{err}</p></div></div>;
  if (!data) return <Splash />;

  const Views = { today: <TodayView onGoto={goto} />, timetable: <TimetableView />, workload: <WorkloadView />, marks: <MarksView />, inbox: <InboxView /> };

  return (
    <Ctx.Provider value={{ data, role, setRole, refresh, mutate }}>
      <MotionConfig reducedMotion="user">
        <div className="graph-paper min-h-screen">
          <div className="flex">
            <aside className="sticky top-0 hidden h-screen w-[232px] shrink-0 flex-col border-r border-line bg-white/70 px-3 py-5 backdrop-blur lg:flex">
              <div className="flex items-center gap-2.5 px-2"><Logo /><div className="leading-none"><p className="font-display text-lg font-800 tracking-tight">SchoolPilot</p><p className="mt-0.5 text-[11px] text-muted">Clasa {data.student.class}</p></div></div>
              <nav className="mt-7 flex flex-col gap-1">
                {NAV.map((n) => { const on = view === n.id; return (
                  <button key={n.id} onClick={() => goto(n.id)} className={cx('group relative flex items-center gap-3 rounded-xl px-3 py-2.5 text-[14.5px] font-700 transition-colors', on ? 'text-brand-600' : 'text-muted hover:bg-paper hover:text-ink')}>
                    {on && <motion.span layoutId="rail-active" transition={spring} className="absolute inset-0 rounded-xl bg-brand-50 ring-1 ring-brand-100" />}
                    <span className="relative z-10"><n.icon size={20} /></span><span className="relative z-10">{n.label}</span>
                  </button>
                ); })}
              </nav>
              <div className="mt-auto space-y-1">
                <button onClick={() => setPrivOpen(true)} className="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-[13.5px] font-700 text-muted hover:bg-paper hover:text-ink"><Icons.shield size={19} /> Confidențialitate</button>
                <RolePicker role={role} setRole={setRole} open={roleOpen} setOpen={setRoleOpen} />
              </div>
            </aside>

            <main className="min-w-0 flex-1">
              <header className="sticky top-0 z-30 flex items-center justify-between border-b border-line bg-white/80 px-4 py-3 backdrop-blur lg:hidden" style={{ paddingTop: 'max(0.75rem, env(safe-area-inset-top))' }}>
                <div className="flex items-center gap-2"><Logo size={30} /><span className="font-display text-base font-800">SchoolPilot</span></div>
                <div className="flex items-center gap-1.5">
                  <button onClick={() => setPrivOpen(true)} className="grid h-9 w-9 place-items-center rounded-lg text-muted hover:bg-paper"><Icons.shield size={19} /></button>
                  <button onClick={() => setRoleOpen(true)} className="inline-flex items-center gap-1.5 rounded-full bg-paper px-2.5 py-1.5 text-[12.5px] font-700"><Icons.user size={14} /> {ROLES[role]}</button>
                </div>
              </header>
              <AnimatePresence mode="wait">
                <motion.div key={view} initial={reduce ? false : { opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} exit={reduce ? {} : { opacity: 0, y: -8 }} transition={{ duration: .22 }}>{Views[view]}</motion.div>
              </AnimatePresence>
            </main>
          </div>

          <nav className="fixed inset-x-0 bottom-0 z-30 border-t border-line bg-white/90 backdrop-blur lg:hidden" style={{ paddingBottom: 'env(safe-area-inset-bottom)' }}>
            <div className="mx-auto flex max-w-md items-stretch justify-around px-2 py-1.5">
              {NAV.map((n) => { const on = view === n.id; return (
                <button key={n.id} onClick={() => goto(n.id)} className="relative flex flex-1 flex-col items-center gap-0.5 rounded-xl py-1.5">
                  {on && <motion.span layoutId="tab-active" transition={spring} className="absolute inset-x-2 top-0 h-1 rounded-full bg-brand" />}
                  <n.icon size={21} className={on ? 'text-brand' : 'text-muted'} /><span className={cx('text-[10.5px] font-700', on ? 'text-brand' : 'text-muted')}>{n.label}</span>
                </button>
              ); })}
            </div>
          </nav>

          <Sheet open={roleOpen} onClose={() => setRoleOpen(false)} labelledBy="role-title">
            {roleOpen && (
              <motion.div initial={{ opacity: 0, y: 24 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: 24 }} transition={spring} className="relative z-10 w-full max-w-md rounded-t-xl2 bg-white p-6 shadow-lift sm:rounded-xl2 lg:hidden">
                <div className="h-1.5 w-10 mx-auto mb-4 rounded-full bg-line" />
                <h3 id="role-title" className="font-display text-lg font-700">Schimbă rolul</h3><p className="text-[13px] text-muted">Aceeași aplicație, vedere adaptată.</p>
                <div className="mt-4 grid grid-cols-3 gap-2">{Object.keys(ROLES).map((r) => <button key={r} onClick={() => { setRole(r); setRoleOpen(false); }} className={cx('rounded-xl border p-3 text-sm font-700', role === r ? 'border-brand bg-brand-50 text-brand-600' : 'border-line hover:bg-paper')}><Icons.user size={18} className="mx-auto mb-1" />{ROLES[r]}</button>)}</div>
              </motion.div>
            )}
          </Sheet>
          <PrivacySheet open={privOpen} onClose={() => setPrivOpen(false)} />
        </div>
      </MotionConfig>
    </Ctx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
